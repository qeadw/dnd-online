<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Reptilian head -->
  <ellipse cx="100" cy="58" rx="22" ry="24" fill="#4a6a3a" opacity="0.9"/>
  <!-- Snout -->
  <ellipse cx="100" cy="72" rx="14" ry="8" fill="#3a5a2a" opacity="0.8"/>
  <!-- Brow ridges -->
  <path d="M80 48 Q85 42 92 46" fill="none" stroke="#5a7a4a" stroke-width="2.5" opacity="0.7"/>
  <path d="M120 48 Q115 42 108 46" fill="none" stroke="#5a7a4a" stroke-width="2.5" opacity="0.7"/>
  <!-- Body with scales suggestion -->
  <path d="M76 76 L68 148 L132 148 L124 76 Z" fill="#3a5a2a" opacity="0.8"/>
  <!-- Scale pattern -->
  <circle cx="90" cy="95" r="4" fill="none" stroke="#5a7a4a" stroke-width="0.8" opacity="0.3"/>
  <circle cx="100" cy="90" r="4" fill="none" stroke="#5a7a4a" stroke-width="0.8" opacity="0.3"/>
  <circle cx="110" cy="95" r="4" fill="none" stroke="#5a7a4a" stroke-width="0.8" opacity="0.3"/>
  <circle cx="95" cy="105" r="4" fill="none" stroke="#5a7a4a" stroke-width="0.8" opacity="0.3"/>
  <circle cx="105" cy="105" r="4" fill="none" stroke="#5a7a4a" stroke-width="0.8" opacity="0.3"/>
  <!-- Reptilian eyes -->
  <ellipse cx="88" cy="52" rx="5" ry="4" fill="#8aaa2a"/>
  <ellipse cx="112" cy="52" rx="5" ry="4" fill="#8aaa2a"/>
  <ellipse cx="88" cy="52" rx="1.5" ry="4" fill="#1a1a2e"/>
  <ellipse cx="112" cy="52" rx="1.5" ry="4" fill="#1a1a2e"/>
  <!-- Nostrils -->
  <circle cx="95" cy="70" r="1.5" fill="#2a4a1a"/>
  <circle cx="105" cy="70" r="1.5" fill="#2a4a1a"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a227" font-weight="bold">Lizardfolk</text>
</svg>