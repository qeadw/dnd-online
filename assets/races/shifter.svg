<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Beast-like head -->
  <ellipse cx="100" cy="58" rx="20" ry="22" fill="#a07840" opacity="0.9"/>
  <!-- Pointed ears (wolf-like) -->
  <path d="M80 48 L72 28 L88 42 Z" fill="#a07840" opacity="0.85"/>
  <path d="M120 48 L128 28 L112 42 Z" fill="#a07840" opacity="0.85"/>
  <path d="M82 46 L75 32 L87 43 Z" fill="#8a6830" opacity="0.5"/>
  <path d="M118 46 L125 32 L113 43 Z" fill="#8a6830" opacity="0.5"/>
  <!-- Fur/mane around face -->
  <path d="M78 50 Q72 55 74 65 Q70 58 75 68" fill="#8a6830" opacity="0.6"/>
  <path d="M122 50 Q128 55 126 65 Q130 58 125 68" fill="#8a6830" opacity="0.6"/>
  <path d="M82 70 Q78 75 80 80" fill="#8a6830" opacity="0.5"/>
  <path d="M118 70 Q122 75 120 80" fill="#8a6830" opacity="0.5"/>
  <!-- Body -->
  <path d="M78 76 L72 148 L128 148 L122 76 Z" fill="#8a6830" opacity="0.7"/>
  <!-- Beast eyes -->
  <circle cx="90" cy="54" r="4" fill="#dda020"/>
  <circle cx="110" cy="54" r="4" fill="#dda020"/>
  <circle cx="90" cy="54" r="2" fill="#1a1a2e"/>
  <circle cx="110" cy="54" r="2" fill="#1a1a2e"/>
  <!-- Animal nose -->
  <ellipse cx="100" cy="66" rx="5" ry="3.5" fill="#5a4020" opacity="0.8"/>
  <!-- Snarl/mouth -->
  <path d="M90 72 Q100 78 110 72" fill="none" stroke="#6a5030" stroke-width="1.5"/>
  <!-- Fang hints -->
  <path d="M93 72 L94 76" stroke="#ddd" stroke-width="1" opacity="0.5"/>
  <path d="M107 72 L106 76" stroke="#ddd" stroke-width="1" opacity="0.5"/>
  <!-- Claw marks decoration -->
  <line x1="40" y1="100" x2="50" y2="130" stroke="#a07840" stroke-width="1" opacity="0.15"/>
  <line x1="44" y1="100" x2="54" y2="130" stroke="#a07840" stroke-width="1" opacity="0.15"/>
  <line x1="48" y1="100" x2="58" y2="130" stroke="#a07840" stroke-width="1" opacity="0.15"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9a227" font-weight="bold">Shifter</text>
</svg>