<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Small dragon-like head -->
  <ellipse cx="100" cy="62" rx="18" ry="18" fill="#cc7a20" opacity="0.9"/>
  <!-- Snout -->
  <ellipse cx="100" cy="72" rx="10" ry="6" fill="#bb6a10" opacity="0.8"/>
  <!-- Small horns -->
  <path d="M84 50 L78 35 L88 48 Z" fill="#aa5a00" opacity="0.8"/>
  <path d="M116 50 L122 35 L112 48 Z" fill="#aa5a00" opacity="0.8"/>
  <!-- Small body -->
  <path d="M84 78 L80 145 L120 145 L116 78 Z" fill="#bb6a10" opacity="0.7"/>
  <!-- Tail -->
  <path d="M110 140 Q130 135 140 145 Q135 140 125 142" fill="#cc7a20" opacity="0.6" stroke="#cc7a20" stroke-width="2"/>
  <!-- Big reptilian eyes -->
  <circle cx="90" cy="58" r="5" fill="#ffaa00"/>
  <circle cx="110" cy="58" r="5" fill="#ffaa00"/>
  <ellipse cx="90" cy="58" rx="2" ry="4.5" fill="#1a1a2e"/>
  <ellipse cx="110" cy="58" rx="2" ry="4.5" fill="#1a1a2e"/>
  <!-- Nostrils -->
  <circle cx="95" cy="71" r="1.5" fill="#994a00"/>
  <circle cx="105" cy="71" r="1.5" fill="#994a00"/>
  <!-- Scale suggestion -->
  <circle cx="92" cy="90" r="3" fill="none" stroke="#cc7a20" stroke-width="0.6" opacity="0.3"/>
  <circle cx="100" cy="86" r="3" fill="none" stroke="#cc7a20" stroke-width="0.6" opacity="0.3"/>
  <circle cx="108" cy="90" r="3" fill="none" stroke="#cc7a20" stroke-width="0.6" opacity="0.3"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9a227" font-weight="bold">Kobold</text>
</svg>