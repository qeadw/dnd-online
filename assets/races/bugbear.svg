<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Large hulking head -->
  <ellipse cx="100" cy="58" rx="24" ry="26" fill="#8a6a3a" opacity="0.9"/>
  <!-- Pointed ears -->
  <path d="M76 48 L65 32 L80 44 Z" fill="#8a6a3a" opacity="0.85"/>
  <path d="M124 48 L135 32 L120 44 Z" fill="#8a6a3a" opacity="0.85"/>
  <!-- Hulking body - extra wide -->
  <path d="M68 78 L55 148 L145 148 L132 78 Z" fill="#7a5a2a" opacity="0.8"/>
  <!-- Fur texture -->
  <path d="M78 40 Q82 35 80 42" stroke="#9a7a4a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M120 40 Q118 35 122 42" stroke="#9a7a4a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M88 38 Q90 32 92 38" stroke="#9a7a4a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M108 38 Q110 32 112 38" stroke="#9a7a4a" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Brow ridge -->
  <path d="M82 50 Q100 44 118 50" fill="#7a5a2a" opacity="0.6" stroke="#7a5a2a" stroke-width="2"/>
  <!-- Small angry eyes -->
  <circle cx="90" cy="55" r="3" fill="#dda020"/>
  <circle cx="110" cy="55" r="3" fill="#dda020"/>
  <circle cx="90" cy="55" r="1.5" fill="#1a1a2e"/>
  <circle cx="110" cy="55" r="1.5" fill="#1a1a2e"/>
  <!-- Mouth with fangs -->
  <path d="M88 70 Q100 78 112 70" fill="none" stroke="#5a3a1a" stroke-width="1.5"/>
  <path d="M93 70 L95 75 L97 70" fill="#ddd" opacity="0.7"/>
  <path d="M103 70 L105 75 L107 70" fill="#ddd" opacity="0.7"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9a227" font-weight="bold">Bugbear</text>
</svg>