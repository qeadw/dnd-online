  <!-- Hood-like flare -->
  <path d="M78 55 Q70 42 72 58 Q68 48 75 60" fill="#6a4a7a" opacity="0.6"/>
  <path d="M122 55 Q130 42 128 58 Q132 48 125 60" fill="#6a4a7a" opacity="0.6"/>
