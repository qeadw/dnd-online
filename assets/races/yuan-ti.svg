  <path d="M90 90 L95 85 L100 90 L105 85 L110 90" fill="none" stroke="#8a6a9a" stroke-width="0.8" opacity="0.4"/>
  <path d="M88 100 L93 95 L98 100 L103 95 L108 100 L113 95" fill="none" stroke="#8a6a9a" stroke-width="0.8" opacity="0.35"/>
  <!-- Snake eyes - slit pupils -->
  <ellipse cx="90" cy="54" rx="5" ry="4" fill="#aa4aaa"/>
  <ellipse cx="110" cy="54" rx="5" ry="4" fill="#aa4aaa"/>
  <ellipse cx="90" cy="54" rx="1.2" ry="4" fill="#1a1a2e"/>
  <ellipse cx="110" cy="54" rx="1.2" ry="4" fill="#1a1a2e"/>
  <!-- Forked tongue -->
  <path d="M100 68 L100 75 L97 78 M100 75 L103 78" fill="none" stroke="#aa4aaa" stroke-width="1" opacity="0.6"/>
  <!-- Snake coil at bottom -->
