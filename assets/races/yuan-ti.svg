  <defs>
    <radialGradient id="poison-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6a2a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#1a1a2e"/>
  <rect width="200" height="200" fill="url(#poison-glow)"/>
  <!-- Humanoid head with snake features -->
