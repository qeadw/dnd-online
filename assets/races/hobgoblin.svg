<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Militaristic head -->
  <ellipse cx="100" cy="58" rx="20" ry="22" fill="#8a3a2a" opacity="0.9"/>
  <!-- Helmet -->
  <path d="M78 50 Q80 28 100 24 Q120 28 122 50 Z" fill="#4a4a4a" opacity="0.8"/>
  <path d="M98 24 L100 15 L102 24" fill="#4a4a4a" opacity="0.8"/>
  <!-- Helmet crest -->
  <path d="M100 15 Q105 18 108 24" fill="none" stroke="#8a2020" stroke-width="3" opacity="0.7"/>
  <path d="M100 15 Q95 18 92 24" fill="none" stroke="#8a2020" stroke-width="3" opacity="0.7"/>
  <!-- Pointed ears -->
  <path d="M78 55 L68 42 L80 50 Z" fill="#8a3a2a" opacity="0.8"/>
  <path d="M122 55 L132 42 L120 50 Z" fill="#8a3a2a" opacity="0.8"/>
  <!-- Armored body -->
  <path d="M76 75 L68 148 L132 148 L124 75 Z" fill="#5a5a5a" opacity="0.8"/>
  <!-- Armor lines -->
  <line x1="80" y1="85" x2="120" y2="85" stroke="#6a6a6a" stroke-width="1" opacity="0.5"/>
  <line x1="78" y1="100" x2="122" y2="100" stroke="#6a6a6a" stroke-width="1" opacity="0.5"/>
  <line x1="76" y1="115" x2="124" y2="115" stroke="#6a6a6a" stroke-width="1" opacity="0.5"/>
  <!-- Stern eyes -->
  <ellipse cx="90" cy="55" rx="4" ry="2.5" fill="#cc2020"/>
  <ellipse cx="110" cy="55" rx="4" ry="2.5" fill="#cc2020"/>
  <circle cx="90" cy="55" r="1.5" fill="#1a1a2e"/>
  <circle cx="110" cy="55" r="1.5" fill="#1a1a2e"/>
  <!-- Flat nose -->
  <path d="M96 62 L100 66 L104 62" fill="none" stroke="#7a2a1a" stroke-width="1.5"/>
  <!-- Frown -->
  <path d="M90 70 Q100 68 110 70" fill="none" stroke="#6a2a1a" stroke-width="1.5"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a227" font-weight="bold">Hobgoblin</text>
</svg>