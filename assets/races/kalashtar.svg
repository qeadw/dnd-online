<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="psychic-aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8a4aaa" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#5a2a7a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#1a1a2e"/>
  <rect width="200" height="200" fill="url(#psychic-aura)"/>
  <!-- Serene humanoid head -->
  <ellipse cx="100" cy="58" rx="18" ry="22" fill="#c4a882" opacity="0.9"/>
  <!-- Flowing hair -->
  <path d="M82 48 Q78 30 74 45 Q70 35 72 50 Q68 42 70 55" fill="#2a1a3a" opacity="0.8"/>
  <path d="M118 48 Q122 30 126 45 Q130 35 128 50 Q132 42 130 55" fill="#2a1a3a" opacity="0.8"/>
  <path d="M82 42 Q90 28 100 25 Q110 28 118 42" fill="#2a1a3a" opacity="0.8"/>
  <!-- Body -->
  <path d="M80 76 L74 148 L126 148 L120 76 Z" fill="#3a2a4a" opacity="0.7"/>
  <!-- Serene closed eyes -->
  <path d="M86 56 Q90 53 94 56" fill="none" stroke="#8a6a9a" stroke-width="1.5"/>
  <path d="M106 56 Q110 53 114 56" fill="none" stroke="#8a6a9a" stroke-width="1.5"/>
  <!-- Gentle smile -->
  <path d="M94 68 Q100 72 106 68" fill="none" stroke="#b09070" stroke-width="1"/>
  <!-- Third eye / psychic symbol -->
  <circle cx="100" cy="44" r="3" fill="#aa6aee" opacity="0.6"/>
  <circle cx="100" cy="44" r="5" fill="none" stroke="#aa6aee" stroke-width="0.5" opacity="0.4"/>
  <!-- Psychic waves -->
  <ellipse cx="100" cy="55" rx="30" ry="30" fill="none" stroke="#8a4aaa" stroke-width="0.8" opacity="0.2"/>
  <ellipse cx="100" cy="55" rx="40" ry="40" fill="none" stroke="#8a4aaa" stroke-width="0.6" opacity="0.15"/>
  <ellipse cx="100" cy="55" rx="50" ry="50" fill="none" stroke="#8a4aaa" stroke-width="0.4" opacity="0.1"/>
  <!-- Floating psychic particles -->
  <circle cx="55" cy="40" r="1.5" fill="#aa6aee" opacity="0.3"/>
  <circle cx="148" cy="48" r="1" fill="#aa6aee" opacity="0.25"/>
  <circle cx="45" cy="80" r="1" fill="#aa6aee" opacity="0.2"/>
  <circle cx="155" cy="75" r="1.2" fill="#aa6aee" opacity="0.2"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a227" font-weight="bold">Kalashtar</text>
</svg>