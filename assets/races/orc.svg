  <line x1="120" y1="56" x2="124" y2="65" stroke="#8a1a1a" stroke-width="2" opacity="0.5"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9a227" font-weight="bold">Orc</text>
