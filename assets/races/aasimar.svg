<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#1a1a2e"/>
  <rect width="200" height="200" fill="url(#glow)"/>
  <!-- Body -->
  <ellipse cx="100" cy="68" rx="18" ry="22" fill="#d4a574" opacity="0.9"/>
  <path d="M82 85 L75 140 L125 140 L118 85 Z" fill="#d4a574" opacity="0.8"/>
  <!-- Wings -->
  <path d="M80 80 Q50 30 20 50 Q40 60 55 75 Z" fill="url(#wing)" opacity="0.7"/>
  <path d="M120 80 Q150 30 180 50 Q160 60 145 75 Z" fill="url(#wing)" opacity="0.7"/>
  <!-- Wing feather details -->
  <path d="M75 75 Q55 40 30 55" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  <path d="M125 75 Q145 40 170 55" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  <!-- Halo -->
  <ellipse cx="100" cy="40" rx="22" ry="6" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="92" cy="64" r="2.5" fill="#ffd700"/>
  <circle cx="108" cy="64" r="2.5" fill="#ffd700"/>
  <!-- Glow effect -->
  <circle cx="100" cy="75" r="45" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="75" r="55" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.1"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9a227" font-weight="bold">Aasimar</text>
</svg>