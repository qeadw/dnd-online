  <rect x="105" y="48" width="10" height="5" rx="1" fill="#4aeaff" opacity="0.9"/>
  <!-- Forehead plate line -->
  <line x1="90" y1="38" x2="90" y2="46" stroke="#3a5a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="38" x2="110" y2="46" stroke="#3a5a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="34" x2="100" y2="46" stroke="#3a5a7a" stroke-width="1" opacity="0.5"/>
  <!-- Armored body -->
  <path d="M74 82 L66 148 L134 148 L126 82 Z" fill="#4a6a8a" opacity="0.8"/>
