  <circle cx="100" cy="105" r="10" fill="none" stroke="#5a8aaa" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="105" r="5" fill="#4aeaff" opacity="0.2"/>
  <!-- Joint lines -->
  <line x1="74" y1="95" x2="126" y2="95" stroke="#3a5a7a" stroke-width="1" opacity="0.4"/>
  <line x1="72" y1="120" x2="128" y2="120" stroke="#3a5a7a" stroke-width="1" opacity="0.4"/>
  <!-- Rivet details -->
  <circle cx="80" cy="95" r="1.5" fill="#5a8aaa" opacity="0.4"/>
  <circle cx="120" cy="95" r="1.5" fill="#5a8aaa" opacity="0.4"/>
  <circle cx="78" cy="120" r="1.5" fill="#5a8aaa" opacity="0.4"/>
  <circle cx="122" cy="120" r="1.5" fill="#5a8aaa" opacity="0.4"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a227" font-weight="bold">Warforged</text>
