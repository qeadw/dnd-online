<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="silver-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c0c0c0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#1a1a2e"/>
  <rect width="200" height="200" fill="url(#silver-glow)"/>
  <!-- Featureless humanoid head -->
  <ellipse cx="100" cy="58" rx="19" ry="23" fill="#c0c0c0" opacity="0.7"/>
  <!-- Body -->
  <path d="M80 76 L74 148 L126 148 L120 76 Z" fill="#a0a0a0" opacity="0.5"/>
  <!-- Where eyes would be - just subtle indentations -->
  <ellipse cx="90" cy="54" rx="4" ry="2" fill="#b0b0b0" opacity="0.5"/>
  <ellipse cx="110" cy="54" rx="4" ry="2" fill="#b0b0b0" opacity="0.5"/>
  <!-- Where nose would be -->
  <line x1="100" y1="58" x2="100" y2="65" stroke="#b0b0b0" stroke-width="1" opacity="0.4"/>
  <!-- Where mouth would be -->
  <line x1="93" y1="70" x2="107" y2="70" stroke="#b0b0b0" stroke-width="1" opacity="0.3"/>
  <!-- Shifting/morphing effect - ghostly outlines -->
  <ellipse cx="96" cy="56" rx="20" ry="24" fill="none" stroke="#d0d0d0" stroke-width="0.5" opacity="0.2"/>
  <ellipse cx="104" cy="60" rx="20" ry="24" fill="none" stroke="#d0d0d0" stroke-width="0.5" opacity="0.15"/>
  <!-- Shimmer particles -->
  <circle cx="75" cy="45" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="130" cy="55" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="65" cy="85" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="140" cy="95" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="85" cy="35" r="0.8" fill="#ffffff" opacity="0.25"/>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a227" font-weight="bold">Changeling</text>
</svg>