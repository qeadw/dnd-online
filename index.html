<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Online</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg-darkest, #1a1a1a);
        }

        .spa-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 10px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold, #e4a11b);
            position: relative;
            z-index: 100;
        }

        .spa-header h1 {
            color: var(--accent-gold, #e4a11b);
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-family: 'Cinzel', 'Georgia', serif;
            text-shadow: 0 0 10px rgba(228, 161, 27, 0.3);
        }

        .spa-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .spa-nav .nav-tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            font-family: inherit;
            white-space: nowrap;
        }

        .spa-nav .nav-tab:hover {
            background: rgba(228, 161, 27, 0.15);
            color: #fff;
            border-color: rgba(228, 161, 27, 0.3);
        }

        .spa-nav .nav-tab.active {
            background: rgba(228, 161, 27, 0.2);
            color: var(--accent-gold, #e4a11b);
            border-color: var(--accent-gold, #e4a11b);
            border-bottom-color: transparent;
        }

        .pages-container {
            position: relative;
            width: 100%;
            height: calc(100vh - var(--header-height, 90px));
        }

        .page-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: var(--bg-darkest, #1a1a1a);
        }

        .page-frame.active {
            display: block;
        }

        /* Loading indicator */
        .page-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold, #e4a11b);
            font-size: 1.2rem;
            display: none;
        }

        .page-loading.active {
            display: block;
        }

        .page-loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(228, 161, 27, 0.3);
            border-top-color: var(--accent-gold, #e4a11b);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .spa-header {
                padding: 8px 10px;
            }

            .spa-header h1 {
                font-size: 1.2rem;
                margin-bottom: 6px;
            }

            .spa-nav .nav-tab {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .spa-nav .nav-tab {
                padding: 5px 8px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="multiplayer-overlay"></div>
    <header class="spa-header">
        <h1>D&D Online</h1>
        <nav class="spa-nav">
            <button class="nav-tab active" data-page="game-tools">Game Tools</button>
            <button class="nav-tab" data-page="character-creator">Character Creator</button>
            <button class="nav-tab" data-page="characters">My Characters</button>
            <button class="nav-tab" data-page="spells">Spells</button>
            <button class="nav-tab" data-page="monsters">Monsters</button>
            <button class="nav-tab" data-page="monster-builder">Monster Builder</button>
            <button class="nav-tab" data-page="combat">Combat</button>
            <button class="nav-tab" data-page="inventory">Inventory</button>
            <button class="nav-tab" data-page="maps">Maps</button>
            <button class="nav-tab" data-page="session">Session</button>
        </nav>
    </header>

    <div class="pages-container" id="pagesContainer">
        <div class="page-loading" id="pageLoading">Loading</div>
    </div>

    <script>
        // Page definitions
        const PAGES = {
            'game-tools': 'game-tools.html',
            'character-creator': 'character-creator.html',
            'characters': 'characters.html',
            'spells': 'spells.html',
            'monsters': 'monsters.html',
            'monster-builder': 'monster-builder.html',
            'combat': 'combat.html',
            'inventory': 'inventory.html',
            'maps': 'maps.html',
            'session': 'session.html'
        };

        // Page name mapping for navigation from iframes
        const PAGE_URL_TO_KEY = {};
        Object.entries(PAGES).forEach(([key, url]) => {
            PAGE_URL_TO_KEY[url] = key;
        });
        // Also map index.html to game-tools for backwards compat
        PAGE_URL_TO_KEY['index.html'] = 'game-tools';

        const container = document.getElementById('pagesContainer');
        const loadingEl = document.getElementById('pageLoading');
        const loadedFrames = {};
        let currentPage = null;

        // Calculate header height for iframe sizing
        function updateHeaderHeight() {
            const header = document.querySelector('.spa-header');
            if (header) {
                document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
            }
        }

        // Navigate to a page
        function navigateTo(pageKey) {
            if (pageKey === currentPage) return;

            // Update nav tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.page === pageKey);
            });

            // Hide current frame
            if (currentPage && loadedFrames[currentPage]) {
                loadedFrames[currentPage].classList.remove('active');
            }

            // Show or create the iframe
            if (loadedFrames[pageKey]) {
                loadedFrames[pageKey].classList.add('active');
                loadingEl.classList.remove('active');
            } else {
                // Lazy-load: create iframe on first visit
                loadingEl.classList.add('active');

                const iframe = document.createElement('iframe');
                iframe.className = 'page-frame';
                iframe.dataset.page = pageKey;
                iframe.src = PAGES[pageKey] + '?embed=1';
                iframe.addEventListener('load', () => {
                    loadingEl.classList.remove('active');
                    iframe.classList.add('active');
                });
                container.appendChild(iframe);
                loadedFrames[pageKey] = iframe;
            }

            currentPage = pageKey;

            // Save last active page
            localStorage.setItem('dndSpaActivePage', pageKey);

            // Update URL hash
            history.replaceState(null, '', '#' + pageKey);
        }

        // Listen for navigation messages from iframes
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'spa-navigate') {
                const pageKey = PAGE_URL_TO_KEY[e.data.page];
                if (pageKey) {
                    navigateTo(pageKey);
                }
            }
        });

        // Nav tab click handlers
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                navigateTo(tab.dataset.page);
            });
        });

        // Initialize
        updateHeaderHeight();
        window.addEventListener('resize', updateHeaderHeight);

        // Determine starting page
        const hashPage = location.hash.slice(1);
        const savedPage = localStorage.getItem('dndSpaActivePage');
        const startPage = (hashPage && PAGES[hashPage]) ? hashPage
            : (savedPage && PAGES[savedPage]) ? savedPage
            : 'game-tools';

        navigateTo(startPage);
    </script>
    <script src="multiplayer.js"></script>
    <script src="multiplayer-ui.js"></script>
</body>
</html>
